# Pinned development verification. NONFREE binaries are never uploaded.
on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: "linux-${{ inputs.architecture }} pinned native checks"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Build pinned sources
        run: bash src/AAXCleanNative/build-native.sh artifacts/native release linux-${{ inputs.architecture }}
      - name: Execute matching-host drain and error checks
        run: python3 src/AAXCleanNative/native-receipt.py verify --source src/AAXCleanNative --build artifacts/native/release --rid linux-${{ inputs.architecture }}
      - name: Upload verification records only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-records-linux-${{ inputs.architecture }}
          path: |
            artifacts/native/release/build-receipt.json
            artifacts/native/release/native-verification.json
            artifacts/native/release/toolchain.txt
            artifacts/native/release/exports.txt
            artifacts/native/release/linked-libraries.txt
            artifacts/native/release/build.log
            artifacts/native/release/verify-*.log
          if-no-files-found: warn
          retention-days: 7

# Pinned development verification. NONFREE binaries are never uploaded.
on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      runner:
        type: string
        required: true
      msystem:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: "win-${{ inputs.architecture }} pinned native checks"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ inputs.msystem }}
          install: make
          pacboy: >-
            toolchain:p
            cmake:p
            python:p
      - name: Build pinned sources
        run: bash src/AAXCleanNative/build-native.sh artifacts/native release win-${{ inputs.architecture }}
      - name: Execute matching-host drain and error checks
        run: python3 src/AAXCleanNative/native-receipt.py verify --source src/AAXCleanNative --build artifacts/native/release --rid win-${{ inputs.architecture }}
      - name: Upload verification records only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-records-win-${{ inputs.architecture }}
          path: |
            artifacts/native/release/build-receipt.json
            artifacts/native/release/native-verification.json
            artifacts/native/release/toolchain.txt
            artifacts/native/release/exports.txt
            artifacts/native/release/linked-libraries.txt
            artifacts/native/release/build.log
            artifacts/native/release/verify-*.log
          if-no-files-found: warn
          retention-days: 7

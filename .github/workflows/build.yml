# Reusable library build with explicit optional NuGet publication.
---
name: build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: 'Publish the built package; failures and duplicates fail the job'
        required: false
        default: false
      version_override:
        type: string
        description: 'Version number override'
        required: false
      project_file:
        type: string
        description: 'Path to the .csproj file'
        required: true
      nuspec_file:
        type: string
        description: 'Path to the .nuspec file'
        required: true
    secrets:
      nuget_token:
        description: 'Nuget Api authentication token'
        required: false      

env:
  DOTNET_CONFIGURATION: 'Release'
  DOTNET_VERSION: '10.x'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build:
    name: ${{ inputs.publish && 'Build and Publish' || 'Build and Validate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_token }}
          
      - name: Publication contract regressions
        run: python3 -m unittest discover -s scripts -p 'test_publish.py' -v

      - name: Get version
        id: get_version
        working-directory: 
        run: |
          inputVersion="${{ inputs.version_override }}"
          if [[ "${#inputVersion}" -gt 0 ]]
          then
            version="${inputVersion}"
          else
            version="$(grep -Eio -m 1 '<Version>.*</Version>' ${{ inputs.project_file }} | sed -r 's/<\/?Version>//g')"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Package admission regressions
        run: python3 -m unittest discover -s tools/packaging -p 'test_*.py' -v

      - name: Build and Pack
        id: build_pack
        run: |
          nuspec_relative=$(realpath --relative-to="$(dirname ${{ inputs.project_file }})" "${{ inputs.nuspec_file }}")
          dotnet build ${{ inputs.project_file }} -c ${{ env.DOTNET_CONFIGURATION }}
          dotnet pack ${{ inputs.project_file }} --no-build -c ${{ env.DOTNET_CONFIGURATION }} -o . -p:NuspecFile="$nuspec_relative" -p:PackageVersion="${{ steps.get_version.outputs.version }}" -p:NuspecProperties="version=${{ steps.get_version.outputs.version }}"
          nupkg=$(ls *.nupkg)
          python3 tools/packaging/preflight.py --root . --manifest tools/packaging/artifacts.json --nuspec "${{ inputs.nuspec_file }}" --version "${{ steps.get_version.outputs.version }}" --archive "$nupkg"
          echo "nupkg=${nupkg}" >> "${GITHUB_OUTPUT}"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: '${{ steps.build_pack.outputs.nupkg }}'
          path: ./${{ steps.build_pack.outputs.nupkg }}
          if-no-files-found: error
          retention-days: 7
          
      - name: Publish nupkg
        if: ${{ inputs.publish }}
        env:
          NUGET_API_KEY: ${{ secrets.nuget_token }}
          PACKAGE_PATH: ${{ steps.build_pack.outputs.nupkg }}
        run: bash scripts/publish-package.sh "$PACKAGE_PATH" "$NUGET_SOURCE"
              

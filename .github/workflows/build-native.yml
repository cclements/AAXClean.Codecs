name: build-native

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/AAXCleanNative/**'
      - '.github/workflows/build-native.yml'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/build-mac.yml'
      - '.github/workflows/build-win.yml'
      - 'tools/packaging/preflight.py'

permissions:
  contents: read

jobs:
  receipt-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check fail-closed receipt contracts
        run: |
          python3 -m unittest discover -s src/AAXCleanNative/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/packaging -p 'test_*.py' -v
  build-native-linux:
    strategy:
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/build-linux.yml
    with:
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      
  build-native-mac:
    strategy:
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    uses: ./.github/workflows/build-mac.yml
    with:
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      
  build-native-win:
    strategy:
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            msystem: MINGW64
            runner: windows-2025
          - architecture: arm64
            msystem: CLANGARM64
            runner: windows-11-arm
    uses: ./.github/workflows/build-win.yml
    with:
      runner: ${{ matrix.runner }}
      msystem: ${{ matrix.msystem }}
      architecture: ${{ matrix.architecture }}
